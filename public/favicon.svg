<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Crucianelli Solid Corporate Red Background -->
  <rect width="512" height="512" rx="104" fill="#DE1C24" />

  <!-- Crucianelli Iconic Dual-Track White 'C' -->
