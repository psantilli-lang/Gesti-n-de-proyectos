    <!-- Top Horizontal Bar 1 (Upper Outer) -->
    <polygon points="230,76 480,76 460,128 230,128" />

    <!-- Top Horizontal Bar 2 (Upper Inner) -->
    <polygon points="245,150 460,150 442,202 245,202" />

