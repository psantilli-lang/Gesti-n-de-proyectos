    <!-- Bottom Horizontal Bar 1 (Lower Inner) is integrated in path above: (245,345) to (415,345) to (398,397) to (245,397) -->

    <!-- Outer Lower Crescent and Bottom Horizontal Bar 2 (Lower Outer) -->
    <path d="M 155,205 C 120,250 102,305 102,365 C 102,425 145,475 235,475 L 388,475 L 370,423 L 235,423 C 178,423 148,390 148,345 C 148,295 162,250 185,205 Z" />
  </g>
</svg>
